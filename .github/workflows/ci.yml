name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ secrets.TURBO_TEAM }}

jobs:
  ci:
    name: Lint / Typecheck / Build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Cache Turborepo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ github.sha }}
          restore-keys: turbo-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: PHI guard (PR diff)
        if: github.event_name == 'pull_request'
        run: |
          git fetch origin ${{ github.base_ref }} --depth=1
          DIFF=$(git diff origin/${{ github.base_ref }}...HEAD)
          # Block on SSN pattern
          if echo "$DIFF" | grep -qP '\b[0-9]{3}-[0-9]{2}-[0-9]{4}\b'; then
            echo "PHI_GUARD FAIL: potential SSN detected in diff"
            exit 1
          fi
          # Block on DOB pattern
          if echo "$DIFF" | grep -qP '\b(0[1-9]|1[0-2])/(0[1-9]|[12][0-9]|3[01])/(19|20)[0-9]{2}\b'; then
            echo "PHI_GUARD FAIL: potential DOB detected in diff"
            exit 1
          fi
          echo "PHI guard passed"

      # CI (lint/typecheck/build) runs without production secrets. Unit
      # tests that require DB / WorkOS / AWS creds live in the deploy
      # pipeline post-provisioning, not here. No SSM fetch needed for
      # static analysis — that was the Doppler pattern; we do not
      # reproduce it.
      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      # Tests — 0.3+ will add db tests once DATABASE_URL is available via SSM
      # in the deploy pipeline. CI stays creds-free.
      # - name: Test
      #   run: pnpm test
